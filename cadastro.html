<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cadastro</title>
  </head>
  <body>
    <div class="box">
      <h1>pagina de login!</h1>
      <input id="name" type="text" placeholder="nome" />
      <input id="email" type="email" placeholder="email" />
      <input id="password" type="password" placeholder="senha" />
      <button id="btn">cadastrar-se</button>
      <p>Já tem uma conta? <a href="index.html">logar</a></p>
      <p id="msg"></p>
    </div>

    <!--JAVASCRIPT-->

    <script>
      const name = document.getElementById('name');
      const email = document.getElementById('email');
      const password = document.getElementById('password');
      const btn = document.getElementById('btn');
      const msg = document.getElementById('msg');

      btn.addEventListener('click', async () => {
        const response = await fetch('http://localhost:3000/cadastro', {
          method: 'POST',

          headers: {
            'content-type': 'application/json',
          },

          body: JSON.stringify({
            name: name.value,
            email: email.value,
            password: password.value,
          }),
        });
        const data = await response.json();

        console.log(data);

          msg.textContent = data.mensagem;

          setTimeout(() => {
          msg.textContent = '';
        }, 3000);

      });
    </script>

    <!--CSS-->

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }

      #msg {
        text-align: center;
        color: white;
        font-weight: bold;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111;
      }

      .box {
        width: 350px;
        padding: 30px;
        display: flex;
        flex-direction: column;
        gap: 15px;
        background: #1c1c1c;
        border-radius: 12px;
        box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
      }

      h1 {
        text-align: center;
        color: white;
        margin-bottom: 10px;
      }

      input {
        padding: 12px;
        border: none;
        outline: none;
        border-radius: 6px;
        background: #2a2a2a;
        color: white;
        font-size: 16px;
      }

      input::placeholder {
        color: white;
      }

      button {
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: #5865f2;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
      }

      button:hover {
        background: #4752c4;
        transform: scale(1.02);
      }

      p {
        text-align: center;
        color: #aaa;
        font-size: 14px;
      }

      a {
        color: #5865f2;
        text-decoration: none;
        font-weight: bold;
        transition: 0.2s;
      }

      a:hover {
        color: #7280ff;
        text-decoration: underline;
      }
    </style>
  </body>
</html>
